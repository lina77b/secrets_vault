{% extends "base.html" %}
{% block title %}{{ title }} · SecVault{% endblock %}
{% block content %}
<div class="page narrow">
  <a class="back" href="{% if workspace %}{% url 'workspace' workspace.pk %}{% else %}{% url 'dashboard' %}{% endif %}">Back to {% if workspace %}{{ workspace.name }}{% else %}my vault{% endif %}</a>
  <h1>{{ title }}</h1>
  <form method="post" class="panel">{% csrf_token %}
    {% include "_fields.html" %}
    <div class="actions">
      <button class="btn primary">Save secret</button>
      <button type="button" class="btn" id="generate">Generate password</button>
    </div>
  </form>
</div>
{% endblock %}
